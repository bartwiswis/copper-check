<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopperCheck GTO</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { 
            background: #121212; 
            color: #f5f5f5; 
            font-family: monospace; 
            text-align: center; 
            margin: 0; 
            padding: 15px; 
        }
        h2 { color: #ffb74d; margin-bottom: 5px; }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border: 2px solid #e65100;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        video { width: 100%; display: block; }
        button {
            background: #e65100;
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            border-radius: 6px;
            margin-top: 15px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
        }
        button:active { background: #bf360c; }
        .result-box { 
            margin-top: 15px; 
            font-size: 22px; 
            color: #ffb74d; 
            font-weight: bold; 
            background: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <h2>COPPERCHECK GTO</h2>
    <p style="font-size: 12px; color: #aaa;">Celuj obiektywem w granulat lub przekrój kabla</p>
    
    <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <button id="camera-button" onclick="initCamera()">URUCHOM KAMERĘ</button>
    <button id="scan-button" onclick="triggerScan()" disabled>SKANUJ WSAD</button>
    
    <div class="result-box" id="output" role="status" aria-live="polite">System gotowy do uruchomienia kamery.</div>

    <!-- Ładujemy OpenCV.js asynchronicznie -->
    <script async src="https://docs.opencv.org/4.5.0/opencv.js" onload="onOpenCvReady()"></script>
    <script src="Nowy%20folder/app.js"></script>
</body>
</html>
